# Runs every check on each pull request and on master. A red check means:
# do not merge. The weekly run repeats only the dependency checks
# (python-lock, pip-audit, npm-audit), so a new advisory shows up without a
# code change.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event name is in the group, so a scheduled or manual run never cancels
# or queues behind a pull request run on the same ref. Only pull request runs
# cancel an older run of the same PR; push, schedule and manual runs finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: python -m pytest -q

  # The locks are generated on macOS; Render runs Linux. Recompiling every
  # .in file here must give the committed lock byte for byte.
  python-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install pip-tools from its lock
        run: python -m pip install --require-hashes --no-deps -r requirements-tools.txt
      - name: Recompile the locks
        run: |
          pip-compile -q requirements.in
          pip-compile -q -o requirements-dev.txt requirements-dev.in
          pip-compile -q -o requirements-tools.txt requirements-tools.in
      - name: Locks match their .in files
        run: git diff --exit-code -- requirements.txt requirements-dev.txt requirements-tools.txt

  # Fails on any known advisory in the runtime lock (pip-audit has no
  # severity filter). The dev and tools locks are only reported.
  # pip-audit exits 1 on an advisory and on an error (fails closed).
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Runtime lock (fails on any advisory)
        run: pip-audit --require-hashes --disable-pip -r requirements.txt
      - name: Dev lock (report only)
        continue-on-error: true
        run: pip-audit --require-hashes --disable-pip -r requirements-dev.txt
      - name: pip-tools lock (report only)
        continue-on-error: true
        run: pip-audit --require-hashes --disable-pip -r requirements-tools.txt

  # Fails on a high or critical advisory in the runtime packages (what ships
  # in the browser bundle). The full tree, dev tooling included, is only
  # reported. npm audit exits non-zero on an advisory at the level and on a
  # registry error (fails closed).
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Runtime packages (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: All packages (report only)
        continue-on-error: true
        run: npm audit

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test -- --watch=false
      - name: Production build
        run: npx ng build
      - name: Link-preview tags in the build
        run: node scripts/check-og-tags.mjs

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment
        run: python -m venv backend/venv && backend/venv/bin/python -m pip install --require-hashes --no-deps -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Layout checks (Playwright, phone, desktop, tablet)
        run: npm run e2e
        working-directory: frontend
      # Traces and screenshots of failed tests only. This job must stay free of
      # real secrets: anything the browser sees can end up in a trace, and the
      # artifact is downloadable from this public repository.
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-attempt-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
